<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151a" />
    <title>MonsterFusion — 融合のアトリエ</title>
    <meta
      name="description"
      content="2体を融合して、世界に1体だけのモンスターを育てるブラウザゲーム。見た目も覚える技も遺伝で決まります。部位から覚えた技を3つ選んで、100戦のアリーナへ。登録不要ですぐ遊べます。"
    />

    <!--
      The share card. Absolute URLs on purpose: most clients resolve a relative
      og:image, but some fetch it as given and show nothing without the host.
      They are written out rather than built, because a <meta> tag is read by a
      crawler that never runs the page's JavaScript.

      The address below is the published one, and the build swaps it for
      wherever that build is going - set MONSTERFUSION_SITE, not these lines
      (see vite.config.ts). Written out in full, with no placeholder, so the
      file served straight off disk is still a correct page.
    -->
    <meta property="og:url" content="https://kossihana-ui.github.io/MonsterFusion/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MonsterFusion" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="MonsterFusion — 融合のアトリエ" />
    <meta
      property="og:description"
      content="2体を融合して、世界に1体だけのモンスターを。技は体の部位から決まり、負けると仲間を失います。週替わりのアリーナで、何連勝できますか。"
    />
    <meta property="og:image" content="https://kossihana-ui.github.io/MonsterFusion/og.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="420" />
    <meta property="og:image:alt" content="モス・イグニス・アクアの3体が並ぶMonsterFusionのタイトル画像" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MonsterFusion — 融合のアトリエ" />
    <meta
      name="twitter:description"
      content="2体を融合して、世界に1体だけのモンスターを。技は体の部位から決まり、負けると仲間を失います。週替わりのアリーナで、何連勝できますか。"
    />
    <meta name="twitter:image" content="https://kossihana-ui.github.io/MonsterFusion/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
